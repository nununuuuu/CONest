name: Validate integrated workspace
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/provider-tools.mjs'
      - 'scripts/tests/**'
      - 'build.bat'
      - '.github/workflows/validate-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conest-workspace-validation
  cancel-in-progress: true
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            native-host
      - name: Routing tests
        run: node --experimental-strip-types --test scripts/tests/provider-routing.mjs
      - name: Build using build.bat
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $text = Get-Content -Raw -Encoding UTF8 build.bat
          $text = [regex]::Replace($text, '(?m)^\s*pause\s*$', '')
          [IO.File]::WriteAllText((Join-Path $PWD 'build-ci.bat'), $text, [Text.UTF8Encoding]::new($false))
          cmd /c build-ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real download, CPU conversion and persistence tests
        shell: pwsh
        run: |
          $env:CONEST_TEST_YTDLP = (Resolve-Path 'dist-package/CONest-Portable/yt-dlp.exe').Path
          $env:CONEST_TEST_FFMPEG = (Resolve-Path 'dist-package/CONest-Portable/ffmpeg.exe').Path
          python scripts/tests/provider-headless.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify output and package portable app
        shell: pwsh
        run: |
          foreach ($file in @('CONest-Setup.exe','CONest-Extension.zip','CONest-Portable/CONest.exe','CONest-Portable/aria2c.exe','CONest-Portable/ffmpeg.exe','CONest-Portable/DanmakuFactory.exe','CONest-Portable/conest-native-host.exe','CONest-Portable/yt-dlp.exe','CONest-Portable/deno.exe','CONest-Portable/provider-versions.json')) {
            $path = Join-Path 'dist-package' $file
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Missing build output: $path" }
          }
          Compress-Archive -Path 'dist-package/CONest-Portable/*' -DestinationPath 'dist-package/CONest-Portable.zip' -Force
      - name: Downloadable build outputs
        uses: actions/upload-artifact@v4
        with:
          name: CONest-integrated-workspace-${{ github.sha }}
          path: dist-package/
          if-no-files-found: error
