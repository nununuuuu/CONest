name: Publish CONest

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conest-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected version X.Y.Z: $version" }
          $tag = "v$version"
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne $tag) {
            throw "Tag does not match package.json version: $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $path = 'src-tauri/tauri.conf.json'
          $cfg = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          $cfg.version = $version
          [IO.File]::WriteAllText((Join-Path $PWD $path), ($cfg | ConvertTo-Json -Depth 100), [Text.UTF8Encoding]::new($false))
          $cargo = 'src-tauri/Cargo.toml'
          $text = Get-Content -Raw -Encoding UTF8 $cargo
          $pattern = '(?ms)(^\[package\]\s*.*?^version\s*=\s*)"[^"]*"'
          if (-not [regex]::IsMatch($text, $pattern)) { throw 'Cargo package version not found' }
          $matcher = [regex]::new($pattern)
          $text = $matcher.Replace($text, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $m.Groups[1].Value + '"' + $version + '"' }, 1)
          [IO.File]::WriteAllText((Join-Path $PWD $cargo), $text, [Text.UTF8Encoding]::new($false))

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build
          cache-on-failure: true
          workspaces: |
            src-tauri
            native-host

      - name: Check engine preparation and provider routing
        shell: pwsh
        run: |
          node --check scripts/provider-tools.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test scripts/tests/provider-routing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build using build.bat
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $text = Get-Content -Raw -Encoding UTF8 build.bat
          $text = [regex]::Replace($text, '(?m)^\s*pause\s*$', '')
          [IO.File]::WriteAllText((Join-Path $PWD 'build-ci.bat'), $text, [Text.UTF8Encoding]::new($false))
          cmd /c build-ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test packaged media engines
        shell: pwsh
        run: |
          $env:CONEST_TEST_YTDLP = (Resolve-Path 'dist-package/CONest-Portable/yt-dlp.exe').Path
          $env:CONEST_TEST_FFMPEG = (Resolve-Path 'dist-package/CONest-Portable/providers/ffmpeg.exe').Path
          python scripts/tests/provider-headless.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package release outputs
        shell: pwsh
        run: |
          $required = @(
            'dist-package/CONest-Setup.exe',
            'dist-package/CONest-Extension.zip',
            'dist-package/CONest-Portable/CONest.exe',
            'dist-package/CONest-Portable/aria2c.exe',
            'dist-package/CONest-Portable/ffmpeg.exe',
            'dist-package/CONest-Portable/DanmakuFactory.exe',
            'dist-package/CONest-Portable/conest-native-host.exe',
            'dist-package/CONest-Portable/yt-dlp.exe',
            'dist-package/CONest-Portable/deno.exe',
            'dist-package/CONest-Portable/providers/ffmpeg.exe',
            'dist-package/CONest-Portable/providers/ffprobe.exe',
            'dist-package/CONest-Portable/provider-versions.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
              throw "Missing or empty build output: $path"
            }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist-package/CONest-Setup.exe release-assets/
          Copy-Item dist-package/CONest-Extension.zip release-assets/
          Compress-Archive -Path 'dist-package/CONest-Portable/*' -DestinationPath 'release-assets/CONest-Portable.zip' -CompressionLevel Optimal -Force
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt
          Get-ChildItem release-assets -File | Select-Object Name,Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CONest ${{ steps.version.outputs.tag }}
          body: |
            Built and tested from source using build.bat.
            Choose CONest-Setup.exe for installation or CONest-Portable.zip for a portable app.
            CONest-Extension.zip contains the browser extension.
            The portable package contains the required media engines and licenses.
            SHA256SUMS.txt contains checksums for the downloads.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
