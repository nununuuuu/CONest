name: Publish CONest v0.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/publish-v0.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.push.outputs.source_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode preserved source overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/overlay-probe
          cd /tmp/overlay-probe
          npm init -y >/dev/null 2>&1
          npm install --silent base65536
          WORKSPACE="$GITHUB_WORKSPACE" node <<'JS'
          const fs = require('fs');
          const base65536 = require('base65536');
          const root = process.env.WORKSPACE;
          const text = fs.readFileSync(root + '/.bootstrap/overlay.000','utf8') + fs.readFileSync(root + '/.bootstrap/overlay.001','utf8');
          const buf = Buffer.from(base65536.decode(text));
          fs.writeFileSync('/tmp/overlay.bin', buf);
          let format = 'unknown';
          if (buf.subarray(0,6).equals(Buffer.from([0xfd,0x37,0x7a,0x58,0x5a,0x00]))) format = 'xz';
          else if (buf.subarray(0,4).equals(Buffer.from([0x50,0x4b,0x03,0x04]))) format = 'zip';
          else if (buf.subarray(0,2).equals(Buffer.from([0x1f,0x8b]))) format = 'gzip';
          else if (buf.subarray(0,200).toString('utf8').includes('diff --git')) format = 'patch';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `format=${format}\nsize=${buf.length}\n`);
          console.log(`decoded overlay: ${buf.length} bytes, format=${format}`);
          JS

      - name: Validate overlay archive
        shell: bash
        run: |
          set -euo pipefail
          case '${{ steps.overlay.outputs.format }}' in
            xz) xz -tv /tmp/overlay.bin ;;
            zip) unzip -t /tmp/overlay.bin ;;
            gzip) gzip -t /tmp/overlay.bin ;;
            patch) test -s /tmp/overlay.bin ;;
            *) echo 'Unknown overlay format' >&2; exit 1 ;;
          esac

      - name: Decode build patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = [
              '.bootstrap/patch.part00.b64', '.bootstrap/patch.part01.b64',
              '.bootstrap/patch.part02_03.b64', '.bootstrap/patch.part04_05.b64',
              '.bootstrap/patch.part06_07.b64', '.bootstrap/patch.part08_09.b64',
              '.bootstrap/patch.part10_11.b64', '.bootstrap/patch.part12_13.b64',
              '.bootstrap/patch.part14.b64',
          ]
          raw = b''.join(Path(p).read_bytes() for p in parts)
          raw = b''.join(raw.split())
          raw += b'=' * (-len(raw) % 4)
          Path('/tmp/build.patch.xz').write_bytes(base64.b64decode(raw, validate=False))
          PY
      - name: Validate build patch archive
        shell: bash
        run: xz -tv /tmp/build.patch.xz
      - name: Decode new-files patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('.bootstrap').glob('newfiles.patch.xz.b64.part0*'))
          raw = b''.join(p.read_bytes() for p in parts)
          raw = b''.join(raw.split())
          raw += b'=' * (-len(raw) % 4)
          Path('/tmp/newfiles.patch.xz').write_bytes(base64.b64decode(raw, validate=False))
          PY
      - name: Validate new-files patch archive
        shell: bash
        run: xz -tv /tmp/newfiles.patch.xz
      - name: Decompress patches
        shell: bash
        run: |
          set -euo pipefail
          xz -dc /tmp/build.patch.xz > /tmp/build.patch
          xz -dc /tmp/newfiles.patch.xz > /tmp/newfiles.patch
          test -s /tmp/build.patch
          test -s /tmp/newfiles.patch

      - name: Reconstruct CONest v0.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/btjawa/BiliTools.git /tmp/source
          git -C /tmp/source checkout 1ebe12c49ca224bb221954f72845b3b8c1aaea25
          git -C /tmp/source apply --check --binary /tmp/build.patch
          git -C /tmp/source apply --binary /tmp/build.patch
          git -C /tmp/source apply --check --binary /tmp/newfiles.patch
          git -C /tmp/source apply --binary /tmp/newfiles.patch

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/source
          test -f build.bat
          test -f extension/manifest.json
          test -f native-host/Cargo.toml
          test -f native-host/src/main.rs
          test -f src-tauri/src/services/local_api.rs
          test -f src-tauri/src/native_messaging.rs
          test -f src/i18n/locales/zh-TW.json
          node -e "const p=require('./package.json'); if(p.version!=='0.0.0') process.exit(1)"
          node -e "const p=require('./src-tauri/tauri.conf.json'); if(p.productName!=='CONest'||p.version!=='0.0.0'||p.identifier!=='com.nununuuuu.conest') process.exit(1)"
          node --check extension/background.js
          node --check extension/content.js
          if find . -type f \( -name 'CONest-updater.key' -o -name '*.key' \) ! -name '*.key.pub' | grep -q .; then
            echo 'Private key file detected; refusing to publish.' >&2
            exit 1
          fi
          if grep -RIlE 'minisign (encrypted|unencrypted) secret key' . --exclude-dir=.git | grep -q .; then
            echo 'Private signing key material detected; refusing to publish.' >&2
            exit 1
          fi

      - name: Publish source to main
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git rm -r --ignore-unmatch .
          git clean -fdx
          rsync -a --exclude='.git' /tmp/source/ ./
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'CONest_v0.0.0'
          git push origin main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify source commit
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ needs.prepare-source.outputs.source_sha }}') { throw "main moved unexpectedly: $actual" }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'
          run_install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build CONest
        shell: pwsh
        run: |
          (Get-Content build.bat) | Where-Object { $_ -notmatch '^\s*pause\s*$' } | Set-Content build-ci.bat
          cmd /c build-ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Portable ZIP
        shell: pwsh
        run: |
          if (Test-Path 'dist-package\CONest-Portable.zip') { Remove-Item 'dist-package\CONest-Portable.zip' -Force }
          Compress-Archive -Path 'dist-package\CONest-Portable\*' -DestinationPath 'dist-package\CONest-Portable.zip' -Force
      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @('dist-package\CONest-Setup.exe','dist-package\CONest-Portable.zip','dist-package\CONest-Extension.zip')
          foreach ($asset in $assets) { if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" } }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0
          target_commitish: ${{ needs.prepare-source.outputs.source_sha }}
          name: CONest_v0.0.0
          body: v0.0.0 上線
          draft: false
          prerelease: false
          files: |
            dist-package/CONest-Setup.exe
            dist-package/CONest-Portable.zip
            dist-package/CONest-Extension.zip
