name: Publish CONest v0.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/publish-v0.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.push.outputs.source_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patches
        shell: bash
        run: |
          set -u
          LOG=/tmp/reconstruct-diagnostics.md
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo '=== input files ==='
          wc -c .bootstrap/patch.part*.b64 .bootstrap/newfiles.patch.xz.b64.part0*

          python3 - <<'PY'
          import base64
          from pathlib import Path

          groups = {
              '/tmp/build.patch.xz': [
                  '.bootstrap/patch.part00.b64',
                  '.bootstrap/patch.part01.b64',
                  '.bootstrap/patch.part02_03.b64',
                  '.bootstrap/patch.part04_05.b64',
                  '.bootstrap/patch.part06_07.b64',
                  '.bootstrap/patch.part08_09.b64',
                  '.bootstrap/patch.part10_11.b64',
                  '.bootstrap/patch.part12_13.b64',
                  '.bootstrap/patch.part14.b64',
              ],
              '/tmp/newfiles.patch.xz': sorted(str(p) for p in Path('.bootstrap').glob('newfiles.patch.xz.b64.part0*')),
          }

          alphabet = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          for dst, parts in groups.items():
              out = bytearray()
              print(f'-- decoding {dst}')
              for name in parts:
                  raw = Path(name).read_bytes()
                  clean = b''.join(raw.split())
                  filtered = bytes(c for c in clean if c in alphabet)
                  filtered += b'=' * (-len(filtered) % 4)
                  print(f'{name}: raw={len(raw)} clean={len(clean)} filtered={len(filtered)}')
                  try:
                      decoded = base64.b64decode(filtered, validate=False)
                  except Exception as e:
                      print(f'DECODE ERROR {name}: {e!r}')
                      raise
                  out.extend(decoded)
              Path(dst).write_bytes(out)
              print(f'{dst}: bytes={len(out)} magic={out[:12].hex()}')
          PY
          PY_STATUS=$?

          echo '=== decoded files ==='
          ls -l /tmp/build.patch.xz /tmp/newfiles.patch.xz 2>/dev/null || true
          file /tmp/build.patch.xz /tmp/newfiles.patch.xz 2>/dev/null || true

          BUILD_XZ=99
          NEW_XZ=99
          if [ -f /tmp/build.patch.xz ]; then
            xz -tv /tmp/build.patch.xz
            BUILD_XZ=$?
          fi
          if [ -f /tmp/newfiles.patch.xz ]; then
            xz -tv /tmp/newfiles.patch.xz
            NEW_XZ=$?
          fi
          echo "statuses: python=$PY_STATUS build_xz=$BUILD_XZ newfiles_xz=$NEW_XZ"

          if [ "$PY_STATUS" -eq 0 ] && [ "$BUILD_XZ" -eq 0 ] && [ "$NEW_XZ" -eq 0 ]; then
            xz -dc /tmp/build.patch.xz > /tmp/build.patch
            xz -dc /tmp/newfiles.patch.xz > /tmp/newfiles.patch
            test -s /tmp/build.patch
            test -s /tmp/newfiles.patch
            exit 0
          fi

          cp "$LOG" reconstruct-diagnostics.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reconstruct-diagnostics.md
          git commit -m 'ci: record patch reconstruction diagnostics' || true
          git push origin HEAD:main || true
          exit 1

      - name: Reconstruct CONest v0.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/btjawa/BiliTools.git /tmp/source
          git -C /tmp/source checkout 1ebe12c49ca224bb221954f72845b3b8c1aaea25
          git -C /tmp/source apply --check --binary /tmp/build.patch
          git -C /tmp/source apply --binary /tmp/build.patch
          git -C /tmp/source apply --check --binary /tmp/newfiles.patch
          git -C /tmp/source apply --binary /tmp/newfiles.patch

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/source
          test -f build.bat
          test -f extension/manifest.json
          test -f native-host/Cargo.toml
          test -f native-host/src/main.rs
          test -f src-tauri/src/services/local_api.rs
          test -f src-tauri/src/native_messaging.rs
          test -f src/i18n/locales/zh-TW.json

          node -e "const p=require('./package.json'); if(p.version!=='0.0.0') process.exit(1)"
          node -e "const p=require('./src-tauri/tauri.conf.json'); if(p.productName!=='CONest'||p.version!=='0.0.0'||p.identifier!=='com.nununuuuu.conest') process.exit(1)"
          node --check extension/background.js
          node --check extension/content.js

          if find . -type f \( -name 'CONest-updater.key' -o -name '*.key' \) ! -name '*.key.pub' | grep -q .; then
            echo 'Private key file detected; refusing to publish.' >&2
            exit 1
          fi
          if grep -RIlE 'minisign (encrypted|unencrypted) secret key' . --exclude-dir=.git | grep -q .; then
            echo 'Private signing key material detected; refusing to publish.' >&2
            exit 1
          fi

      - name: Publish source to main
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-main origin/main
          git rm -r --ignore-unmatch .
          git clean -fdx
          rsync -a --exclude='.git' /tmp/source/ ./
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'CONest_v0.0.0'
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source commit
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ needs.prepare-source.outputs.source_sha }}') {
            throw "main moved unexpectedly: $actual"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CONest
        shell: pwsh
        run: |
          (Get-Content build.bat) |
            Where-Object { $_ -notmatch '^\s*pause\s*$' } |
            Set-Content build-ci.bat
          cmd /c build-ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          if (Test-Path 'dist-package\CONest-Portable.zip') {
            Remove-Item 'dist-package\CONest-Portable.zip' -Force
          }
          Compress-Archive -Path 'dist-package\CONest-Portable\*' -DestinationPath 'dist-package\CONest-Portable.zip' -Force

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            'dist-package\CONest-Setup.exe',
            'dist-package\CONest-Portable.zip',
            'dist-package\CONest-Extension.zip'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0
          target_commitish: ${{ needs.prepare-source.outputs.source_sha }}
          name: CONest_v0.0.0
          body: v0.0.0 上線
          draft: false
          prerelease: false
          files: |
            dist-package/CONest-Setup.exe
            dist-package/CONest-Portable.zip
            dist-package/CONest-Extension.zip
