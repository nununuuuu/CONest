name: Publish CONest v53

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conest-v53-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build using build.bat
        shell: pwsh
        run: |
          $text = Get-Content -Raw -Encoding UTF8 build.bat
          $text = [regex]::Replace($text, '(?m)^\s*pause\s*$', '')
          [IO.File]::WriteAllText((Join-Path $PWD 'build-ci.bat'), $text, [Text.UTF8Encoding]::new($false))
          cmd /c build-ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package build outputs
        shell: pwsh
        run: |
          $required = @(
            'dist-package/CONest-Setup.exe',
            'dist-package/CONest-Extension.zip',
            'dist-package/CONest-Portable/CONest.exe',
            'dist-package/CONest-Portable/aria2c.exe',
            'dist-package/CONest-Portable/ffmpeg.exe',
            'dist-package/CONest-Portable/DanmakuFactory.exe',
            'dist-package/CONest-Portable/conest-native-host.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
              throw "Missing or empty build output: $path"
            }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist-package/CONest-Setup.exe release-assets/
          Copy-Item dist-package/CONest-Extension.zip release-assets/
          Compress-Archive -Path 'dist-package/CONest-Portable/*' -DestinationPath 'release-assets/CONest-Portable.zip' -Force
          Compress-Archive -Path 'dist-package' -DestinationPath 'release-assets/CONest-dist-package.zip' -Force
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CONest-v53-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0-v53
          target_commitish: ${{ github.sha }}
          name: CONest v0.0.0 v53
          body: |
            Built directly from the v53 source using build.bat.
            CONest-dist-package.zip includes the complete dist-package directory.
            CONest-Setup.exe, CONest-Portable.zip and CONest-Extension.zip are also available separately.
            SHA256SUMS.txt contains checksums for the downloads.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
